name: homepanel

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: homepanel
      POSTGRES_USER: homepanel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - homepanel-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepanel -d homepanel"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    env_file: .env
    command: ["sh", "-c", "php artisan migrate --force && php artisan homepanel:ensure-admin"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
    user: "1000:1000"
    restart: "no"

  app:
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    env_file: .env
    command: ["php", "artisan", "queue:work", "database", "--sleep=1", "--tries=3", "--timeout=60", "--max-time=3600"]
    user: "1000:1000"
    volumes:
      - .:/var/www/html
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build:
      context: .
      args:
        UID: "1000"
        GID: "1000"
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    user: "1000:1000"
    volumes:
      - .:/var/www/html
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8095:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  homepanel-pg:
